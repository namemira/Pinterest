<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest</title>
     <link rel="stylesheet" href="../css/principal.css">
      <link rel="icon" href="../Imagens/Icone.png">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>
<!--Menu-->
        <nav class="menu" aria-label="Navegação principal">
            <a class="menu-logo" href="#feed" aria-label="Pinterest, página inicial">
                <img src="../Imagens/Icone.png" alt="">
            </a>
            <a class="menu-item ativo" href="Principal.html" aria-label="Página inicial" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.1a1.1 1.1 0 0 1-1.1 1.1h-5.3v-6.3H9.4V21H4.1A1.1 1.1 0 0 1 3 19.9z"/></svg>
                <span class="menu-tooltip">Página inicial</span>
            </a>
            <button class="menu-item" type="button" aria-label="Explorar" aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2.2 5.4-5.4 2.2 2.2-5.4z"/></svg>
                <span class="menu-tooltip">Explorar</span>
            </button>
            <button class="menu-item" type="button" data-menu-action="boards" aria-label="Pastas">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
                <span class="menu-tooltip">Pastas</span>
            </button>
            <button class="menu-item" type="button" data-menu-action="create-pin" aria-label="Criar novo Pin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10M7 12h10"/></svg>
                <span class="menu-tooltip">Criar novo Pin</span>
            </button>
            <button class="menu-item" type="button" aria-label="Notificações" aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
                <span class="menu-tooltip">Notificações</span>
            </button>
            <button class="menu-item" type="button" aria-label="Mensagens" aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 4a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
                <span class="menu-tooltip">Mensagens</span>
            </button>
            <button class="menu-item menu-configuracoes" type="button" aria-label="Configurações" aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 2z"/></svg>
                <span class="menu-tooltip">Configurações</span>
            </button>
        </nav>
<!--Cabecalho-->
        <header class="cabecalho-principal">
            <div class="pesquisa" role="search" aria-label="Pesquisa de Pins">
                <button class="pesquisa-icone" type="button" aria-label="Pesquisar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
                </button>
                <input type="search" placeholder="Pesquisar looks, refeições fáceis etc.">
                <button class="pesquisa-camera" type="button" aria-label="Pesquisar por imagem" aria-disabled="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
            </div>
            <button class="perfil" type="button" aria-label="abrir-perfil" id="abrir-perfil">
                <img src="../Imagens/dog.jpg" alt="Foto perfil">
                <svg class="perfil-seta" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            
        </header>
<!--Perfil-->
        <main class="pagina-perfil">
    <section class="pagina-pastas" id="pagina-pastas"  aria-labelledby="perfil-nome">
                <header class="perfil-pastas">
                    <img class="perfil-pastas-foto" src="../Imagens/dog.jpg" alt="Foto do perfil">
                    <div class="perfil-pastas-identidade">
                        <h1 id="perfil-nome">Seu perfil</h1>
                        <p>Seguidores e pessoas seguindo ainda não disponíveis</p>
                    </div>
                    <button class="perfil-compartilhar" type="button">Compartilhar perfil</button>
                </header>
                <p class="perfil-pastas-status" role="status" aria-live="polite"></p>

                <div class="perfil-abas" role="tablist" aria-label="Conteúdo do perfil">
                    <button id="aba-perfil-pins" type="button" role="tab" aria-selected="false" aria-controls="conteudo-pins">Pins</button>
                    <button id="aba-perfil-pastas" type="button" role="tab" aria-selected="true" aria-controls="conteudo-pastas">Pastas</button>
                </div>

                <section class="organizacao-pastas" id="conteudo-pastas" role="tabpanel" aria-labelledby="aba-perfil-pastas">
                    <header class="pastas-pagina-cabecalho">
                        <div class="pastas-filtros">
                            <button class="botao-filtros" type="button" aria-expanded="false" aria-controls="opcoes-filtros-pastas">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>
                                Filtros
                            </button>
                            <div class="opcoes-filtros-pastas" id="opcoes-filtros-pastas" hidden>
                                <button type="button" data-filtro-pastas="todas" aria-pressed="true">Todas as pastas</button>
                                <button type="button" data-filtro-pastas="compartilhadas" aria-pressed="false">Pastas compartilhadas</button>
                            </div>
                        </div>
                        <button class="pastas-criar-pagina" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                            Criar
                        </button>
                    </header>

                    <div class="pastas-vazio-pagina" id="pastas-vazio-pagina" hidden>
                        <div class="pastas-vazio-ilustracao" aria-hidden="true">
                            <svg viewBox="0 0 180 140"><rect x="34" y="34" width="92" height="76" rx="14"/><path d="M48 34V22a8 8 0 0 1 8-8h66a8 8 0 0 1 8 8v62"/><path d="M57 63h48M57 78h34"/><circle cx="127" cy="94" r="25"/><path d="M127 82v24m-12-12h24"/></svg>
                        </div>
                        <h2>Organize suas ideias</h2>
                        <p>Crie pastas para reunir e organizar os Pins que você salvou.</p>
                        <button class="pastas-criar-vazia" type="button">Criar uma pasta</button>
                    </div>

                    <p class="pastas-pagina-mensagem" id="pastas-pagina-mensagem" role="status" aria-live="polite" hidden></p>
                    <div class="pastas-grade" id="pastas-grade"></div>
                    <section class="pastas-detalhe-pagina" id="pastas-detalhe-pagina"  aria-live="polite"></section>

                    <section class="ideias-nao-organizadas" aria-labelledby="ideias-nao-organizadas-titulo">
                        <h2 id="ideias-nao-organizadas-titulo">Ideias não organizadas</h2>
                        <p class="ideias-nao-organizadas-vazio">Todos os Pins salvos estão organizados nas pastas correspondentes.</p>
                        <div class="ideias-nao-organizadas-grade" id="ideias-nao-organizadas-grade"></div>
                    </section>
                </section>
            </section>
        </main>
<script src="../js/pesquisa.js" defer></script>
<script src="../js/menu.js" defer></script>
<script src="../js/pins.js" defer></script>
<script src="../js/interacoes_pins.js" defer></script>
<script src="../js/pastas.js" defer></script>
<script src="../js/criar_pin.js" defer></script>
<script src="../js/detalhes_pin.js" defer></script>

</body>
</html>
